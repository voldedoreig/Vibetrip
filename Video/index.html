<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VibeTour — Feel Nepal (Cinematic Preview)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="vibetour-stage" class="stage" aria-label="VibeTour Cinematic Animation">
    <!-- Primary Rendering Surface -->
    <canvas id="vibetour-canvas"></canvas>

    <!-- Final Stationary Hero Brand Reveal (Only appears at the end) -->
    <div class="narrative-layer" id="narrative-layer">
      <div class="brand-finale" id="brand-finale" aria-hidden="true">
        <span class="brand-monogram">FIND YOUR PATH • FEEL NEPAL</span>
        <h1 class="brand-title">VibeTour</h1>
        <p class="brand-tagline">Your next journey begins here.</p>
        <button id="replay-cta" class="replay-btn" type="button">
          Replay Journey ↻
        </button>
      </div>
    </div>

    <!-- Unobtrusive Cinematic Controls -->
    <nav class="hud-controls" id="hud-controls" aria-label="Animation Controls">
      <div class="hud-progress-wrap" id="progress-bar-Click" title="Seek timeline">
        <div class="hud-progress-fill" id="hud-progress-fill"></div>
      </div>

      <div class="hud-bar">
        <div class="hud-left">
          <button id="btn-play-pause" class="hud-btn" type="button" title="Play / Pause (Space)">
            <span id="icon-play-pause">Pause</span>
          </button>
          <button id="btn-restart" class="hud-btn" type="button" title="Restart (R)">
            Restart
          </button>
          <button id="btn-audio" class="hud-btn" type="button" title="Toggle Ambient Sound (M)">
            <span id="icon-audio">Sound: Off</span>
          </button>
        </div>

        <div class="hud-center">
          <span id="hud-scene-indicator" class="hud-scene-label">01 / The Mist Trail</span>
          <span id="hud-time" class="hud-time">00:00 / 00:54</span>
        </div>

        <div class="hud-right">
          <button id="btn-fullscreen" class="hud-btn" type="button" title="Fullscreen (F)">
            Fullscreen
          </button>
        </div>
      </div>
    </nav>
  </main>

  <script src="script.js"></script>
</body>
</html>
