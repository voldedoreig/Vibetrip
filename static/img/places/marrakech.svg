<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky_marrakech_svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="60%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  <!-- Postcard Sky Background -->
  <rect width="800" height="600" fill="url(#sky_marrakech_svg)"/>
  
  <!-- Scenic Silhouette Layers -->
  <path d="M0,420 Q200,360 400,410 T800,380 L800,600 L0,600 Z" fill="rgba(0,0,0,0.2)"/>
  <path d="M0,480 Q250,430 500,470 T800,440 L800,600 L0,600 Z" fill="rgba(0,0,0,0.3)"/>
  <circle cx="680" cy="140" r="60" fill="rgba(255,255,255,0.25)" filter="url(#shadow)"/>

  <!-- Postcard Stamp Aesthetic -->
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Centered Icon & Title -->
  <circle cx="400" cy="220" r="64" fill="rgba(255,255,255,0.22)" filter="url(#shadow)"/>
  <text x="400" y="244" font-size="64" text-anchor="middle" dominant-baseline="central">🏺</text>

  <rect x="280" y="315" width="240" height="32" rx="16" fill="rgba(0,0,0,0.35)"/>
  <text x="400" y="336" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CREATIVE SOUL</text>

  <text x="400" y="400" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="middle">Medina Souks</text>
  <text x="400" y="440" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="600" fill="rgba(255,255,255,0.9)" text-anchor="middle">📍 Marrakech, Morocco</text>
</svg>